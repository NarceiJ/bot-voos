name: Monitor Voos 31 Dezembro

on:
  schedule:
    # Executa todos os dias às 09:00 e 18:00 (pode ajustar os horários UTC)
    - cron: '0 9,18 * * *'
  workflow_dispatch: # Permite executar manualmente no botão "Run workflow"

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install requests

      - name: Executar Script de Monitorização
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_voos_31dez.py
